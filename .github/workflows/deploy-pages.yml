name: Deploy MOREX download page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "update.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Pages setup credential
        env:
          PAGES_SETUP_TOKEN: ${{ secrets.PAGES_SETUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PAGES_SETUP_TOKEN:-}" ]]; then
            echo "::error::The PAGES_SETUP_TOKEN repository secret is required to enable Pages the first time. It must have Pages: write and Administration: write access to this repository."
            exit 1
          fi

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_SETUP_TOKEN }}
          enablement: true

      - name: Prepare static site
        run: |
          set -euo pipefail
          test -s index.html
          test -s update.json
          mkdir -p site
          cp index.html update.json site/
          python3 -m json.tool site/update.json >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
